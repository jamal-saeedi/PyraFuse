name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Tests exercise the dependency-light model-zoo API. Installing without
      # dependencies keeps CI fast; the wheel metadata is checked separately.
      - name: Install quality tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff build twine huggingface-hub
          python -m pip install --no-deps .

      - name: Lint public package surface
        run: >-
          ruff check pyrafuse/__init__.py pyrafuse/zoo.py
          pyrafuse/data/__main__.py tests/test_zoo.py

      - name: Test
        run: pytest -q

      - name: Compile
        run: python -m compileall -q pyrafuse scripts

      - name: Build and validate distributions
        run: |
          python -m build
          twine check dist/*
