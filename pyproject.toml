[project]
name = "pyrafuse"
version = "1.1.1"
description = "PyraFuse: DINOv3-based skin, fabric, and background segmentation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Jamal Saeedi"},
]
keywords = [
    "semantic-segmentation",
    "skin-segmentation",
    "fabric-segmentation",
    "skin-fabric-detection",
    "dinov3",
    "tensorrt",
    "executorch",
    "on-device",
    "mobile",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "transformers>=4.50",
    "huggingface-hub>=0.28",
    "safetensors>=0.5",
    "numpy>=1.26",
    "pillow>=10.0",
    "timm>=1.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "langdetect>=1.0.9",
]
release = [
    "build>=1.2",
    "twine>=5.1",
]
data = [
    "albumentations>=1.4",
    "opencv-python>=4.9",
    "pycocotools>=2.0.8",
]
deploy = [
    "onnx>=1.16",
]
mobile = [
    "executorch>=1.5",
]
trt = [
    "onnx>=1.16",
    "tensorrt-cu12>=10.0; platform_system == 'Linux'",
]

[project.scripts]
pyrafuse-data = "pyrafuse.data.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyrafuse"]

[tool.hatch.build.targets.sdist]
include = [
    "pyrafuse",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/jamal-saeedi/PyraFuse"
Repository = "https://github.com/jamal-saeedi/PyraFuse"
Documentation = "https://github.com/jamal-saeedi/PyraFuse#readme"
Issues = "https://github.com/jamal-saeedi/PyraFuse/issues"
Changelog = "https://github.com/jamal-saeedi/PyraFuse/blob/main/CHANGELOG.md"
Models = "https://huggingface.co/jamal-one/PyraFuse"
Author = "https://pypi.org/user/jamal_one/"
