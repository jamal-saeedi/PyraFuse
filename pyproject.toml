[project]
name = "pyrafuse"
version = "0.1.0"
description = "PyraFuse: DINOv3-based skin, fabric, and background segmentation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "License to be announced"}
keywords = [
    "semantic-segmentation",
    "skin-segmentation",
    "fabric-segmentation",
    "skin-fabric-detection",
    "dinov3",
    "tensorrt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "transformers>=4.50",
    "huggingface-hub>=0.28",
    "safetensors>=0.5",
    "numpy>=1.26",
    "pillow>=10.0",
    "timm>=1.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "langdetect>=1.0.9",
]
data = [
    "albumentations>=1.4",
    "opencv-python>=4.9",
    "pycocotools>=2.0.8",
]
deploy = [
    "onnx>=1.16",
]
trt = [
    "onnx>=1.16",
    "tensorrt-cu12>=10.0; platform_system == 'Linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyrafuse"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/jamal-saeedi/PyraFuse"
